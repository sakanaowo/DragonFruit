# Data settings
data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  batch_size: 32
  num_workers: 4
  class_names: ["Fungal Infections (Anthracnose or Stem Canker)","Healthy Fruits","Healthy Leaves","Insect-Infected Fruits","Sunburn Damage"]

# Model settings
model:
  name: resnet50
  num_classes: 5
  pretrained: true
  model_path: models/model.pth

# Training settings
train:
  epochs: 50
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001 # L2 Regularization

# Scheduler settings
scheduler:
  use_scheduler: true
  step_size: 10
  gamma: 0.1

# output settings
output:
  model_save_path: outputs/model.pth
  log_dir: outputs/logs

# random seed
seed: 42